[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power8gdi-configurator"
version = "0.1.0.dev0"
description = "Power8GDI offline calibration studio and future rusEFI ECU client"
requires-python = ">=3.11"
authors = [{name = "R2 Motorsport"}]
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
serial = ["pyserial>=3.5"]

[project.scripts]
power8gdi-configurator = "power8gdi_configurator.app:main"

[tool.setuptools.packages.find]
include = ["power8gdi_configurator*"]
