name: Power8GDI interface consistency

on:
  push:
    branches: [power8gdi-rev-a]
    paths:
      - "Power8GDI/**"
      - ".github/workflows/power8gdi-interface.yml"
  pull_request:
    paths:
      - "Power8GDI/**"
      - ".github/workflows/power8gdi-interface.yml"

jobs:
  pinout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provisional interface mapping
        run: python -m unittest discover -s Power8GDI/tests -v
